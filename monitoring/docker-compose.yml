# Prometheus + Grafana no notebook (host). Os dois usam a rede do host porque o
# redirecionamento de portas do VirtualBox (NAT) escuta em 127.0.0.1 do host.
#   docker compose up -d     -> Prometheus em :9090, Grafana em :3000 (sem login)
#   docker compose down      -> para (os dados do Prometheus ficam no volume)
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-admin-api   # permite o snapshot de backup
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus-dados:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    network_mode: host
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/vm.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/etc/grafana/dashboards:ro,z
    restart: unless-stopped

volumes:
  prometheus-dados:
